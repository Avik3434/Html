<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01_tables</title>
</head>
<style>
  h1 {
    text-align: center;
    font-size: 30px;
  }

  table {
    width: 80%;
    margin: 40px auto;
    border-collapse: collapse;
    font-family: Arial, sans-serif;
    background-color: aliceblue;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    cursor: pointer;
  }

  th,
  td {
    padding: 15px 20px;
    text-align: left;
    border-bottom: 1px solid rgb(168, 196, 255);
  }

  th {
    background-color: #2563eb;
    color: white;
    font-weight: 600;
  }

  tr:hover {
    background-color: #dfefff;
  }

  tr:last-child td {
    border-bottom: none;
  }
</style>

<body>
  <h1>Tables in HTML </h1>
  <table>
    <tr>
      <th>name</th>
      <th>age</th>
      <th>id</th>
      <th>phone no</th>
    </tr>
    <tr>
      <td>
        Avik
      </td>
      <td>
        19
      </td>
      <td>
        001
      </td>
      <td>
        4536457677
      </td>
    </tr>
    <tr>
      <td>priti</td>
      <td>25</td>
      <td>002</td>
      <td>2345654666</td>
    </tr>
  </table>
  <table>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Age</th>
        <th scope="col">ID</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Avik</td>
        <td>19</td>
        <td>001</td>
      </tr>
      <tr>
        <td>Priti</td>
        <td>25</td>
        <td>002</td>
      </tr>
    </tbody>
  </table>
  
</body>

</html>
