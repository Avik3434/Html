<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <link rel="stylesheet" href="first.css"> -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <!-- basic test -->
    <p>
        This is the first paragraph
    </p>
    <!-- headings -->
    <h1>
        This is the first heading
    </h1>
    <!-- strong text -->
    <p>
        This is a <strong>very strong text</strong>
    </p>
    <!-- breaking line (void elements) -->
    <p>
        This line will break here <br>and then start again here
    </p>
    <!-- attributes -->
    <!-- css can be written in a different file -->
    <h2 class="second-heading">
        This is a image
    </h2>

    <!-- images -->
    <img src="https://tse2.mm.bing.net/th/id/OIP.hmGnASRfiNxfOGaszEPVZgHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="The image of a flower" width="300" height="200">

    <!-- labels and inputs -->

    <label for="first-input">This input is disabled</label>
    <input id="first-input" type="text" disabled="disabled" />
    <br />

    <label for="second-input">This input is also disabled</label>
    <input id="second-input" type="text" disabled />
    <br />

    <label for="third-input">This input isn't disabled; you can type into it</label>
    <input id="third-input" type="text" />
</body>
</html>
